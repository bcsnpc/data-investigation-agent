name: Known-domain acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  known-domain-acceptance:
    # Sealed worker descriptors were recorded with Windows Path semantics.
    # Replay the archived producers on that OS; never rewrite their events.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install replay dependencies
        run: pip install -r scripts/requirements-lineage.txt -r scripts/requirements-llm.txt cryptography==44.0.1
      - name: Test private delivery refuses altered ciphertext
        run: python -m unittest discover -s scripts -p test_private_replay_bundle.py
      - name: Download immutable encrypted replay evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c "import json; print(json.load(open('acceptance/known_domain/private-bundle.json'))['release_tag'])")
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern fixture-tapes.aesgcm --dir "$RUNNER_TEMP/replay-ciphertext"
      - name: Verify ciphertext hash before decryption
        env:
          KNOWN_DOMAIN_REPLAY_KEY: ${{ secrets.KNOWN_DOMAIN_REPLAY_KEY }}
        run: python acceptance/known_domain/private_bundle.py "$RUNNER_TEMP/replay-ciphertext/fixture-tapes.aesgcm" "$RUNNER_TEMP/private-replay-inputs"
      - name: Strict fifteen-ticket replay and output gate
        run: python acceptance/known_domain/check.py --fixture-root "$RUNNER_TEMP/private-replay-inputs" --output "$RUNNER_TEMP/known-domain-acceptance"
      - name: Remove decrypted private evidence
        if: always()
        shell: pwsh
        run: |
          $replayRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          foreach ($replayName in @('private-replay-inputs', 'known-domain-acceptance', 'replay-ciphertext')) {
            $replayTarget = [System.IO.Path]::GetFullPath((Join-Path $replayRoot $replayName))
            if (-not $replayTarget.StartsWith($replayRoot + [System.IO.Path]::DirectorySeparatorChar)) { throw 'Cleanup outside runner temp' }
            if (Test-Path -LiteralPath $replayTarget) { Remove-Item -LiteralPath $replayTarget -Recurse -Force }
          }
