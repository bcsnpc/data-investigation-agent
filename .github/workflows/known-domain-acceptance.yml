name: Known-domain acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  known-domain-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install replay dependencies
        run: pip install -r scripts/requirements-lineage.txt -r scripts/requirements-llm.txt
      - name: Strict fifteen-ticket replay and output gate
        run: python acceptance/known_domain/check.py --output /tmp/known-domain-acceptance
