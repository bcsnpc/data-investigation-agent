name: Cloud worker offline foundation
on:
  pull_request:
  push:
    branches: [main, feat/round-eighteen-cloud-foundation]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested code-only image to GHCR
        type: boolean
        default: false
      dev_focus:
        description: Round22 dev image; focused changed-module tests only (full suite remains the release gate)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check staging exclusions, hash seals and complete shard coverage
        run: |
          python -m unittest discover -s scripts -p test_cloud_offline_worker.py
          python -m unittest discover -s scripts -p test_platform_health.py
      - name: Stage tracked code only, excluding evidence and installation configuration
        run: python scripts/build_cloud_image_context.py --output "$RUNNER_TEMP/cloud-context"
      - name: Build non-root, live-disabled worker
        run: |
          docker build -f "$RUNNER_TEMP/cloud-context/infra/cloud-worker/Dockerfile" -t dia-offline:${{ github.sha }} "$RUNNER_TEMP/cloud-context"
          docker save dia-offline:${{ github.sha }} -o "$RUNNER_TEMP/dia-offline.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-worker-code-image
          path: ${{ runner.temp }}/dia-offline.tar
          retention-days: 1
  offline-shards:
    if: ${{ !inputs.dev_focus && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloud-worker-code-image
          path: ${{ runner.temp }}/image
      - name: Run synthetic replay and guard contracts with network disabled
        run: |
          docker load -i "$RUNNER_TEMP/image/dia-offline.tar"
          mkdir -p "$RUNNER_TEMP/results"
          chmod 777 "$RUNNER_TEMP/results"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /app/.local:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001 -v "$RUNNER_TEMP/results:/results" dia-offline:${{ github.sha }} --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-worker-synthetic-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          retention-days: 3
  focused-dev:
    if: ${{ inputs.dev_focus || (github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloud-worker-code-image
          path: ${{ runner.temp }}/image
      - name: Focused investigator changed-module tests, offline and read-only
        run: |
          docker load -i "$RUNNER_TEMP/image/dia-offline.tar"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /app/.local:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001 --entrypoint python dia-offline:${{ github.sha }} -m pytest -q -p no:cacheprovider scripts/test_calculation_intake.py scripts/test_cloud_ledger_investigator.py scripts/test_shared_usage.py scripts/test_ledger_investigator.py scripts/test_retained_graph_continuation.py scripts/test_ledger_investigator_ports.py scripts/test_source_availability.py scripts/test_round23_intake_queries.py scripts/test_round23_reasoning.py scripts/test_round23_triage_tools.py scripts/test_round23_platform.py scripts/test_round23_guided_cases.py scripts/test_round23_answers_native.py scripts/test_round23_text_resolver.py scripts/test_round23_native_catalog.py scripts/test_round23_live_facts.py scripts/test_round23_fixture_control.py scripts/test_round23_provider_schema.py scripts/test_round23_runtime_reads.py
  publish:
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/round-eighteen-cloud-foundation')) && (needs.offline-shards.result == 'success' || needs.focused-dev.result == 'success') }}
    needs: [offline-shards, focused-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloud-worker-code-image
          path: ${{ runner.temp }}/image
      - name: Publish only the tested image, immutable commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i "$RUNNER_TEMP/image/dia-offline.tar"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/offline-worker:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "dia-offline:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
