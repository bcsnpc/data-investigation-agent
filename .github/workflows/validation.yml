  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate PowerShell syntax without connecting to Azure
        shell: powershell
        run: |
          Get-ChildItem infra/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Syntax error in $($_.Name): $errors" }
          }
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/order-portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/order-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
