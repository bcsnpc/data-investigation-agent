name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test deterministic generation and rejection of invalid data
        run: python -m unittest discover -s scripts -p test_generate_orders.py
      - name: Check Fabric notebook and deployment helper syntax
        run: python -m py_compile infra/fabric/bronze_to_silver.py scripts/fabric_api.py scripts/deploy_silver_notebook.py scripts/compare_bronze_order.py
      - name: Install Gold SQL test engine
        run: pip install -r scripts/requirements-fabric-tests.txt
      - name: Test Gold reporting rules and notebook syntax
        run: |
          python -m unittest discover -s scripts -p test_gold_models.py
          python -m py_compile infra/fabric/gold_models.py infra/fabric/silver_to_gold.py scripts/deploy_gold_notebook.py scripts/compare_gold_source.py
      - name: Validate Power BI model, report bindings and deployment syntax
        run: |
          python -m unittest discover -s scripts -p test_powerbi_contract.py
          python -m py_compile infra/fabric/prepare_reporting_dimensions.py scripts/build_powerbi_model.py scripts/build_powerbi_reports.py scripts/deploy_powerbi.py scripts/deploy_reporting_dimensions.py scripts/refresh_powerbi.py scripts/validate_powerbi.py
      - name: Test metadata snapshots and API contracts
        run: |
          python -m unittest discover -s scripts -p test_metadata_inventory.py
          python -m unittest discover -s scripts -p test_metadata_connectors.py
          python -m py_compile scripts/metadata_inventory.py scripts/onelake_metadata.py scripts/validate_metadata_inventory.py scripts/metadata_config.py scripts/metadata_auth.py scripts/metadata_worker.py scripts/metadata_connectors.py scripts/metadata_protocol.py scripts/compare_metadata_scans.py
      - name: Test static lineage and graph traversal
        run: |
          pip install -r scripts/requirements-lineage.txt
          python -m unittest discover -s scripts -p test_lineage.py
          python -m unittest discover -s scripts -p test_lineage_audit.py
          python -m unittest discover -s scripts -p test_lineage_gap_policy.py
          python -m unittest discover -s scripts -p test_publication_lineage_contract.py
          python -m py_compile scripts/lineage_graph.py scripts/lineage_notebook.py scripts/collect_lineage_evidence.py scripts/validate_lineage.py
      - name: Test deterministic investigation evidence
        run: |
          python -m unittest discover -s scripts -p test_investigation_checks.py
          python -m py_compile scripts/investigation_checks.py scripts/check_model_freshness.py
      - name: Test read-only metric adapters and ordered boundaries
        run: |
          python -m unittest discover -s scripts -p test_cross_layer_investigation.py
          python -m unittest discover -s scripts -p test_investigation_selection.py
          python -m unittest discover -s scripts -p test_investigation_evidence_api.py
          python -m unittest discover -s scripts -p test_ticket_workflow.py
          python -m unittest discover -s scripts -p test_ticket_planner.py
          python -m unittest discover -s scripts -p test_snapshot_provenance.py
          python -m unittest discover -s scripts -p test_source_snapshot.py
          python -m unittest discover -s scripts -p test_bronze_publication.py
          python -m unittest discover -s scripts -p test_silver_snapshot_input.py
          python -m unittest discover -s scripts -p test_silver_publication.py
          python -m unittest discover -s scripts -p test_gold_publication.py
          python -m unittest discover -s scripts -p test_semantic_snapshot.py
          python -m py_compile scripts/semantic_snapshot.py
          python -m py_compile scripts/gold_snapshot_input.py scripts/gold_publication.py scripts/record_gold_publication.py
          python -m py_compile scripts/silver_publication.py scripts/record_silver_publication.py
          python -m py_compile scripts/silver_snapshot_input.py infra/fabric/read_pinned_bronze.py
          pip install -r scripts/requirements-publication.txt
          python -m unittest discover -s scripts -p test_snapshot_upload.py
          python -m py_compile scripts/deploy_snapshot_publication.py infra/fabric/publish_source_snapshot.py
          python -m py_compile scripts/cross_layer_investigation.py scripts/investigation_query_worker.py scripts/connect_fabric_sql.py scripts/fabric_sql_auth.py
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate PowerShell syntax without connecting to Azure
        shell: powershell
        run: |
          Get-ChildItem infra/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Syntax error in $($_.Name): $errors" }
          }
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/order-portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/order-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
