name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test deterministic generation and rejection of invalid data
        run: python -m unittest discover -s scripts -p test_generate_orders.py
      - name: Check Fabric notebook and deployment helper syntax
        run: python -m py_compile infra/fabric/bronze_to_silver.py scripts/fabric_api.py scripts/deploy_silver_notebook.py scripts/compare_bronze_order.py
      - name: Install Gold SQL test engine
        run: pip install -r scripts/requirements-fabric-tests.txt
      - name: Test Gold reporting rules and notebook syntax
        run: |
          python -m unittest discover -s scripts -p test_gold_models.py
          python -m py_compile infra/fabric/gold_models.py infra/fabric/silver_to_gold.py scripts/deploy_gold_notebook.py scripts/compare_gold_source.py
      - name: Validate Power BI model, report bindings and deployment syntax
        run: |
          python -m unittest discover -s scripts -p test_powerbi_contract.py
          python -m py_compile infra/fabric/prepare_reporting_dimensions.py scripts/build_powerbi_model.py scripts/build_powerbi_reports.py scripts/deploy_powerbi.py scripts/deploy_reporting_dimensions.py scripts/refresh_powerbi.py scripts/validate_powerbi.py
      - name: Test metadata snapshots and API contracts
        run: |
          python -m unittest discover -s scripts -p test_metadata_inventory.py
          python -m unittest discover -s scripts -p test_metadata_connectors.py
          python -m py_compile scripts/metadata_inventory.py scripts/onelake_metadata.py scripts/validate_metadata_inventory.py scripts/metadata_config.py scripts/metadata_auth.py scripts/metadata_worker.py scripts/metadata_connectors.py scripts/metadata_protocol.py scripts/compare_metadata_scans.py
      - name: Test static lineage and graph traversal
