name: Live access guardrail red team
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deny-by-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-lineage.txt -r scripts/requirements-llm.txt pytest pytest-xdist
      - name: Exercise actual transport seams against write and injection attempts
        run: python -m pytest scripts/test_live_gateway.py scripts/test_scanner_guardrails.py scripts/test_scanner_http.py scripts/test_scanner_dependency_wiring.py scripts/test_scanner_admin.py -n auto -q
