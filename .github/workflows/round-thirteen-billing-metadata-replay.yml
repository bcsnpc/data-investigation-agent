name: Round Thirteen billing metadata replay
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing-metadata-replay:
    name: round-thirteen-billing-metadata-replay
    # Native SQL worker descriptors use Windows path semantics.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install offline replay dependencies
        run: pip install -r scripts/requirements-lineage.txt -r scripts/requirements-llm.txt -r scripts/requirements-replay.txt
      - name: Materialize the immutable suite's canonical consumer
        run: |
          REVISION="$(python -c "import json; print(json.load(open('acceptance/round_thirteen/billing-metadata-replay-suite.json'))['consumer_revision'])")"
          git worktree add --detach "$RUNNER_TEMP/r13-canonical-consumer" "$REVISION"
      - name: Replay immutable billing metadata under explicit consumers
        env:
          GH_TOKEN: ${{ github.token }}
          KNOWN_DOMAIN_REPLAY_KEY: ${{ secrets.KNOWN_DOMAIN_REPLAY_KEY }}
        # Separate from the whole-round suite. V1's negative is expected;
        # V2 proves its narrower protocol/context claim, not live accuracy.
        run: python "$RUNNER_TEMP/r13-canonical-consumer/acceptance/round_thirteen/replay_suite.py" --repo "$RUNNER_TEMP/r13-canonical-consumer" --suite acceptance/round_thirteen/billing-metadata-replay-suite.json --hydrate --output "$RUNNER_TEMP/billing-metadata-replay-results" --scratch-parent "$RUNNER_TEMP"
