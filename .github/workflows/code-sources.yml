name: Recorded code-source verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-source-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install jsonschema
      - name: Read exported code locally and through repository API
        env:
          CODE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_fixture_code_sources.py --revision "$GITHUB_SHA" --output code-source-receipts.json
      - name: Preserve receipts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-source-receipts
          path: code-source-receipts.json
