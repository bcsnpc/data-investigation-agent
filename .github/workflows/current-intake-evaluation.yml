name: Intake contracts (offline)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  pull_request:
    paths:
      - ".github/workflows/current-intake-evaluation.yml"
      - "scripts/run_current_intake_eval.py"
      - "scripts/ticket_planner.py"
      - "scripts/investigator/intake*.py"
      - "scripts/investigator/question_intake.py"
      - "scripts/investigator/question_kind.py"
      - "scripts/investigator/reported_figure.py"
      - "scripts/investigator/numeral_roles.py"
      - "scripts/investigator/value_mentions.py"
      - "scripts/investigator/visual_target.py"
      - "scripts/investigator/report_cells.py"
      - "scripts/investigator/report_scope.py"
      - "scripts/investigator/proposal_limits.py"
      - "scripts/investigator/model_eval_intake.py"
      - "scripts/investigator/model_step_scores.py"
      - "scripts/test_intake*.py"
      - "scripts/test_question_intake.py"
      - "acceptance/model_steps/intake-*.json"
permissions:
  contents: read
concurrency:
  group: current-intake-evaluation
  cancel-in-progress: false
jobs:
  current-intake-evaluation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-lineage.txt -r scripts/requirements-llm.txt
      # The retired R10 Azure CI profile cannot configure the current Key Vault /
      # gateway / shared-budget Anthropic client. Never send unbudgeted provider
      # calls from hosted CI. These are offline contracts, NOT a live quality score;
      # the separately sealed Round24 dev/held-out runs supply that measurement.
      - name: Check current intake contracts and Anthropic gateway without provider calls
        env:
          DIA_LIVE_ACCESS_DISABLED: "1"
          PYTHONPATH: scripts
        run: |
          python -m unittest test_draft_intake_ci test_model_eval_intake test_calculation_intake test_question_intake test_intake_span_references test_intake_name_resolution test_round24_runtime_anthropic test_round24_gateway_components
      - name: Label the measurement honestly
        run: |
          echo 'Offline intake contracts passed; no live model-quality evaluation or estate reads were run. See docs/round-twenty-four-summary.md for the sealed independent live scores.' >> "$GITHUB_STEP_SUMMARY"
