<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local filtered replay</title><link rel="stylesheet" href="/review.css"><script src="/replay.js" defer></script></head><body><aside><div class="brand">DI<span>Data investigator</span></div><p>Local filtered replay</p></aside><main><h1>Review a filtered replay</h1><p>Compare selected Silver and Gold records in the isolated lab. This does not run a Power BI report.</p><p id="message" role="status"></p><section id="login" class="card"><form id="connect"><label for="token">Operator token</label><input id="token" type="password" required autocomplete="off"><button>Connect</button></form></section><section id="choices" class="card" hidden><h2 id="report"></h2><form id="prepare"><div id="fields"></div><button>Prepare scope</button></form></section><section id="review" class="card" hidden><h2>Review scope</h2><p id="status"></p><dl id="scope"></dl><p>The lab snapshot captured during preparation must remain unchanged.</p><label id="confirmation" class="check"><input type="checkbox" id="confirm"> I reviewed these selections.</label><button id="approve">Approve scope</button><button id="run" hidden>Run approved replay</button><button id="refresh" class="secondary">Refresh saved status</button><div id="result"></div></section></main></body></html>
